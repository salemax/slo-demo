name: images

# No path filter, same reason as go.yml: a skipped path-filtered workflow
# reports no status, so it could never be a required check.
# Pull requests build both platforms without pushing; only a push to main
# publishes (job `push`).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Why there is no setup-qemu-action: both Dockerfiles run the build stage on
# the runner's own platform (FROM --platform=$BUILDPLATFORM) and cross-compile
# with GOARCH=$TARGETARCH. The final stage only COPYs the binary into
# distroless, so no instruction ever executes inside a foreign-arch container.
# Add QEMU only if a Dockerfile gains a RUN in the final stage.

jobs:
  # Pull requests: prove the images build for both platforms. This job has
  # only `contents: read`, so a PR run can never write to GHCR.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [service, loadgen]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The docker-container driver is what makes multi-platform builds and
      # attestations possible; the runner's default docker driver supports
      # neither.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/salemax/slo-demo-${{ matrix.image }}
          # Only the 7-character commit SHA, no prefix: same scheme as
          # deploy/kind/kind.sh. No latest, no branch, no semver tags.
          tags: type=sha,prefix=,format=short
          # Default labels already include org.opencontainers.image.source
          # (links the GHCR package to this repo). The default title would be
          # "slo-demo" for both images, so override it.
          labels: |
            org.opencontainers.image.title=slo-demo-${{ matrix.image }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same attestation settings as the push job, so a PR exercises them.
          sbom: true
          provenance: mode=max

  # Push to main: same build, plus login and push. A separate job (not a
  # conditional step) so that `packages: write` exists only on runs that
  # publish. The cost is a duplicated block of steps.
  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [service, loadgen]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/salemax/slo-demo-${{ matrix.image }}
          tags: type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=slo-demo-${{ matrix.image }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and provenance are stored as extra manifests in the image
          # index. mode=max records the full build (all build args, source
          # and the Dockerfile) instead of the minimal subset; the only build
          # args here are TARGETOS/TARGETARCH, so nothing secret can leak.
          sbom: true
          provenance: mode=max

  # One stable check name for branch protection. Exactly one of build/push
  # runs per event; the other is skipped by design, so the gate picks the one
  # that must have run and requires it to be a success. A cancelled or failed
  # job fails the gate instead of passing as skipped.
  images-gate:
    needs: [build, push]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All image builds passed
        env:
          EVENT: ${{ github.event_name }}
          BUILD: ${{ needs.build.result }}
          PUSH: ${{ needs.push.result }}
        run: |
          echo "event: $EVENT build: $BUILD push: $PUSH"
          if [ "$EVENT" = "pull_request" ]; then
            test "$BUILD" = "success"
          else
            test "$PUSH" = "success"
          fi
