apiVersion: 1

# Loads the dashboard JSON files under json/ (mounted with the rest of
# provisioning/, so compose needs no extra volume). The files are the source
# of truth: UI edits are disabled and the files are re-read every 30s.
providers:
  - name: slo-demo
    type: file
    folder: ""
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
