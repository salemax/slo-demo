# Placeholder: a single replica is enough for a local kind demo. More than one
# replica works (the service is stateless), but each pod keeps its own fault
# rules, so an experiment would have to set them on every pod.
replicaCount: 1

image:
  repository: ghcr.io/salemax/slo-demo-service
  # Empty means: defaults to the chart's appVersion (the commit SHA of the
  # published image). Override with --set image.tag=<sha> for a newer image.
  tag: ""
  # IfNotPresent still fits: SHA tags are immutable, so a cached image is never
  # stale, and images loaded with `kind load` (see deploy/kind/kind.sh) must not
  # be pulled.
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # Only the public port is exposed. The admin API (8081) is deliberately not
  # part of the Service.
  port: 8080

# Placeholders, not tuned: the service is tiny and idle-heavy. Revisit when
# loadgen runs in the cluster.
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi

# Placeholders: /healthz answers immediately and is never fault-injected.
probes:
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
